name: Build Win11Clone-OS ISO

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Also publish ISO to GitHub Releases (when under 2 GB)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-iso:
    name: Compile Win11Clone-OS.iso (Debian 13 amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up runner disk space (~25+ GB)
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          echo "Disk space after cleanup:"
          df -h /

      - name: Run deterministic Win11Clone-OS ISO build
        run: |
          set -euo pipefail
          chmod +x build.sh
          sudo ./build.sh

      - name: Verify ISO and checksum
        id: verify
        run: |
          set -euo pipefail
          ls -lh out/Win11Clone-OS.iso out/Win11Clone-OS.iso.sha256
          sha256sum -c out/Win11Clone-OS.iso.sha256
          ISO_BYTES=$(stat -c%s out/Win11Clone-OS.iso)
          echo "iso_bytes=${ISO_BYTES}" >> "$GITHUB_OUTPUT"
          echo "ISO size: ${ISO_BYTES} bytes"

      - name: Upload Win11Clone-OS.iso as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Win11Clone-OS-iso
          path: |
            out/Win11Clone-OS.iso
            out/Win11Clone-OS.iso.sha256
          compression-level: 0
          retention-days: 14

      - name: Upload build log (on failure or success)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Win11Clone-OS-build-log
          path: out/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub Release (if under 2 GB limit)
        if: ${{ inputs.create_release == true && fromJSON(steps.verify.outputs.iso_bytes) < 2000000000 }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0-${GITHUB_RUN_NUMBER}"
          gh release create "${TAG}" \
            out/Win11Clone-OS.iso \
            out/Win11Clone-OS.iso.sha256 \
            --title "Win11Clone-OS (${TAG})" \
            --notes "Automated Debian 13 (Trixie) KDE Plasma 6 hybrid BIOS+UEFI ISO build for VirtualBox."
