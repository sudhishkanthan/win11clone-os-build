name: Build The Nexus OS 1.0 ISO

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Nexus OS Repo
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Install Debian live-build Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools

      - name: Ensure Scripts Are Executable
        run: |
          chmod +x auto/config build.sh
          chmod +x config/hooks/live/*.hook.chroot
          chmod +x config/includes.chroot/usr/local/bin/*

      - name: Build NexusOS-1.0-amd64.iso
        run: ./build.sh

      - name: Upload Bootable ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusOS-1.0-amd64-ISO
          path: NexusOS-1.0-amd64.iso
          retention-days: 14
