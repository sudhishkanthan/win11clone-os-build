[Autologin]
User=nexus
Session=plasma.desktop
Relogin=false

[General]
# Default to Plasma X11 so VirtualBox Guest Additions (auto-resize & shared clipboard) work seamlessly
DisplayServer=x11

[Theme]
Current=nexus-login
CursorTheme=breeze_cursors

[Users]
MaximumUid=60000
MinimumUid=1000
RememberLastUser=true
RememberLastSession=true

[X11]
SessionDir=/usr/share/xsessions
DefaultSession=plasma.desktop
