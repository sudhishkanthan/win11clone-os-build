<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2232" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#0b0f17" stop-opacity="0.60"/>
    </linearGradient>
  </defs>

  <!-- Main Panel Frame (24px pill corners, translucent frosted glass + 1px glossy rim) -->
  <g id="topleft">
    <path d="M 34 10 A 24 24 0 0 0 10 34 L 34 34 Z" fill="url(#glassGrad)"/>
    <path d="M 34 10.5 A 23.5 23.5 0 0 0 10.5 34" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1"/>
  </g>
  <g id="top">
    <rect x="34" y="10" width="40" height="24" fill="url(#glassGrad)"/>
    <line x1="34" y1="10.5" x2="74" y2="10.5" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1"/>
  </g>
  <g id="topright">
    <path d="M 74 10 A 24 24 0 0 1 98 34 L 74 34 Z" fill="url(#glassGrad)"/>
    <path d="M 74 10.5 A 23.5 23.5 0 0 1 97.5 34" fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1"/>
  </g>
  <g id="left">
    <rect x="10" y="34" width="24" height="40" fill="#0d121c" fill-opacity="0.56"/>
    <line x1="10.5" y1="34" x2="10.5" y2="74" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  </g>
  <rect id="center" x="34" y="34" width="40" height="40" fill="#0d121c" fill-opacity="0.56"/>
  <g id="right">
    <rect x="74" y="34" width="24" height="40" fill="#0d121c" fill-opacity="0.56"/>
    <line x1="97.5" y1="34" x2="97.5" y2="74" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  </g>
  <g id="bottomleft">
    <path d="M 10 74 A 24 24 0 0 0 34 98 L 34 74 Z" fill="#0b0f17" fill-opacity="0.58"/>
    <path d="M 10.5 74 A 23.5 23.5 0 0 0 34 97.5" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  </g>
  <g id="bottom">
    <rect x="34" y="74" width="40" height="24" fill="#0b0f17" fill-opacity="0.58"/>
    <line x1="34" y1="97.5" x2="74" y2="97.5" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  </g>
  <g id="bottomright">
    <path d="M 98 74 A 24 24 0 0 1 74 98 L 74 74 Z" fill="#0b0f17" fill-opacity="0.58"/>
    <path d="M 97.5 74 A 23.5 23.5 0 0 1 74 97.5" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
  </g>

  <!-- Blur Mask -->
  <path id="mask-topleft" d="M 34 10 A 24 24 0 0 0 10 34 L 34 34 Z" fill="#000000"/>
  <rect id="mask-top" x="34" y="10" width="40" height="24" fill="#000000"/>
  <path id="mask-topright" d="M 74 10 A 24 24 0 0 1 98 34 L 74 34 Z" fill="#000000"/>
  <rect id="mask-left" x="10" y="34" width="24" height="40" fill="#000000"/>
  <rect id="mask-center" x="34" y="34" width="40" height="40" fill="#000000"/>
  <rect id="mask-right" x="74" y="34" width="24" height="40" fill="#000000"/>
  <path id="mask-bottomleft" d="M 10 74 A 24 24 0 0 0 34 98 L 34 74 Z" fill="#000000"/>
  <rect id="mask-bottom" x="34" y="74" width="40" height="24" fill="#000000"/>
  <path id="mask-bottomright" d="M 98 74 A 24 24 0 0 1 74 98 L 74 74 Z" fill="#000000"/>

  <!-- Padding hints -->
  <rect id="hint-top-margin" x="52" y="10" width="4" height="6" fill="#00ff00" fill-opacity="0"/>
  <rect id="hint-bottom-margin" x="52" y="92" width="4" height="6" fill="#00ff00" fill-opacity="0"/>
  <rect id="hint-left-margin" x="10" y="52" width="12" height="4" fill="#00ff00" fill-opacity="0"/>
  <rect id="hint-right-margin" x="86" y="52" width="12" height="4" fill="#00ff00" fill-opacity="0"/>
  <rect id="hint-compose-over-border" x="0" y="0" width="4" height="4" fill="#00ff00" fill-opacity="0"/>
</svg>
