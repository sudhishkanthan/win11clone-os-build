<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F2FF"/>
      <stop offset="50%" stop-color="#C9E2FF"/>
      <stop offset="100%" stop-color="#9FC8FF"/>
    </linearGradient>
    <radialGradient id="bloomCore" cx="50%" cy="54%" r="42%">
      <stop offset="0%" stop-color="#005FB8" stop-opacity="0.95"/>
      <stop offset="48%" stop-color="#0078D4" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#50B0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petal1" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#60CDFF"/>
      <stop offset="55%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#003E92"/>
    </linearGradient>
    <linearGradient id="petal2" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#99EBFF"/>
      <stop offset="50%" stop-color="#2899F5"/>
      <stop offset="100%" stop-color="#004E8C"/>
    </linearGradient>
    <linearGradient id="petal3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#B4ECFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#1E88E5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#003B73" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="960" cy="580" rx="680" ry="420" fill="url(#bloomCore)" filter="url(#softGlow)"/>

  <!-- Layered Fluent Bloom Ribbon Petals -->
  <path d="M520,760 C460,460 720,180 1010,250 C1280,315 1440,560 1280,790 C1120,960 660,940 520,760 Z"
        fill="url(#petal1)" opacity="0.92"/>
  <path d="M620,720 C600,420 880,220 1160,310 C1390,385 1470,640 1240,810 C1040,940 700,880 620,720 Z"
        fill="url(#petal2)" opacity="0.82"/>
  <path d="M740,680 C760,440 970,320 1180,430 C1340,515 1330,720 1120,800 C940,870 740,790 740,680 Z"
        fill="url(#petal3)" opacity="0.88"/>
  <path d="M600,560 C680,340 940,260 1080,410 C1200,540 1080,740 870,760 C690,775 550,700 600,560 Z"
        fill="#FFFFFF" opacity="0.16"/>
</svg>
